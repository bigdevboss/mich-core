name: build

# The house rule is that a green tree is the only tree: these jobs repeat what
# a developer runs locally, on a clean machine, so a dropped recipe or a flaky
# smoke cannot reach main unnoticed. Profile coverage beyond the default smoke
# stays in release-check because those profiles need tap, MSI hardware
# programming or the netbench peer; the tcp wire profile is the exception,
# because it needs nothing but the guest and a host process to echo to.
#
# The jobs run inside Debian 13 on purpose: that is the toolchain the notes and
# the release runs use (QEMU 10.0.13). The unit battery fails on the runner's
# own Ubuntu 24.04 image, which ships QEMU 8.2: the guest panics with
# "independent kernel tests" right after "adytumfs path operations pass". That
# is a finding to chase on its own; CI should not hide it by pinning to the
# stack the kernel was never tested on.

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 30
    # A shared runner is slower than the developer box, so the QEMU budget the
    # runners default to is widened here rather than tuned down in the scripts.
    env:
      MICH_QEMU_TIMEOUT: "180"
    steps:
      - name: Install the toolchain and the UEFI firmware
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates nodejs make gcc python3 nasm qemu-system-x86 ovmf

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        run: make -j2

      - name: Check every listed object has a recipe
        run: make check-build

      - name: Unit battery
        run: make test64-unit

      - name: Smoke
        run: |
          set -o pipefail
          make test64 2>&1 | tee smoke.log

      # The retry loop in the test64 target exists for a human at a console.
      # Here it is a flake detector: a retry means a race worth looking at.
      - name: Refuse a smoke that needed a retry
        run: |
          if grep -q 'transient smoke failure' smoke.log; then
            echo "the smoke needed a retry: treat this run as a failure" >&2
            exit 1
          fi

      - name: Keep the smoke log when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log
          path: smoke.log
          if-no-files-found: ignore

  tcpwire-smoke:
    # The receive path needs a live peer to prove itself: guestfwd gives the
    # guest a host process to echo to, to half-close against and to read EOF
    # from. The default smoke never puts a frame on a wire.
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 20
    steps:
      - name: Install the toolchain and the UEFI firmware
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates nodejs make gcc python3 nasm qemu-system-x86 ovmf

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: TCP wire smoke
        run: make test64-tcpwire
